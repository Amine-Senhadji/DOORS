[pytest]
testpaths = tests
# La racine du dépôt est dans le chemin de recherche : `pytest` et `python -m pytest` trouvent engine/ et api/.
pythonpath = .
filterwarnings =
    # Avertissement de la bibliothèque de test, sans effet sur nos résultats.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
